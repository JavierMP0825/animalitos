<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdoptaYA - Catálogo de Mascotas</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Iconos -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <!-- CSS personalizado -->
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success fixed-top">
      <div class="container">
        <a class="navbar-brand" href="index.html">
          <i class="bi bi-heart-fill"></i> AdoptaYA
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link active" href="index.html">Catálogo</a></li>
            <li class="nav-item"><a class="nav-link" href="html/postulacion.html">Postular</a></li>
            <li class="nav-item"><a class="nav-link" href="html/postulaciones.html">Mis Postulaciones</a></li>
            <li class="nav-item"><a class="nav-link" href="html/contacto.html">Contacto</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <!-- Catálogo de Mascotas -->
  <main class="container py-5 flex-grow-1 mt-5">
    <h1 class="text-center mb-4 text-success">Catálogo de Mascotas</h1>

    <!-- Filtros y Búsqueda -->
    <div class="row mb-4 g-3 align-items-center bg-light p-3 rounded" id="filtros-y-busqueda">
      <div class="col-md-3">
        <select class="form-select" id="filtro-especie">
          <option selected value="">Toda especie</option>
          <option value="perro">Perros</option>
          <option value="gato">Gatos</option>
          <option value="ave">Aves</option>
        </select>
      </div>
      <div class="col-md-3">
        <select class="form-select" id="filtro-edad">
          <option selected value="">Cualquier edad</option>
          <option value="cachorro">Cachorro</option>
          <option value="joven">Joven</option>
          <option value="adulto">Adulto</option>
        </select>
      </div>
      <div class="col-md-3">
        <select class="form-select" id="filtro-tamaño">
          <option selected value="">Cualquier tamaño</option>
          <option value="pequeño">Pequeño</option>
          <option value="mediano">Mediano</option>
          <option value="grande">Grande</option>
        </select>
      </div>
      <div class="col-md-3">
        <div class="input-group">
          <input type="text" class="form-control" placeholder="Buscar por nombre..." id="busqueda-nombre">
          <button class="btn btn-outline-success" type="button" id="btn-buscar"><i class="bi bi-search"></i></button>
        </div>
      </div>
    </div>

    <!-- Contenedor de Mascotas -->
    <div class="row g-4" id="catalogo-mascotas">
      <!-- Las tarjetas de mascotas se insertarán aquí dinámicamente con JS -->
    </div>
  </main>

  <footer class="bg-success text-white py-4 mt-auto">
    <div class="container text-center">
      <p class="mb-1">&copy; 2025 AdoptaYA | Todos los derechos reservados.</p>
      <nav>
        <a href="html/contacto.html" class="text-white me-3">Contacto</a>
        <a href="html/faq.html" class="text-white me-3">FAQ</a>
      </nav>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/index.js"></script>
  <script src="js/catalogo.js"></script>

</body>
</html>
